name: Sincronizar gist de emisoras

on:
  schedule:
    - cron: '0 12 * * 1'   # cada lunes a las 12 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sincronizar gist
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_PAT }}
          CRAWLER_TOKEN: ${{ secrets.CRAWLER_TOKEN }}
        run: |
          python3 gist_sync.py

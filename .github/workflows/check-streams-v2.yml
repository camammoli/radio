name: Verificar streams v2

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verificar streams y detectar cambios
        env:
          TG_TOKEN:       ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
          CRAWLER_TOKEN:  ${{ secrets.CRAWLER_TOKEN }}
        run: |
          python3 crawlers/check_streams_v2.py --notify --icy --workers 40

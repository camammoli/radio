name: Cerrar sesiones huérfanas

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 min, siempre — mismo TTL que listeners.php
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Disparar limpieza vía API
        env:
          RADIO_ADMIN_KEY: ${{ secrets.RADIO_ADMIN_KEY }}
        run: |
          curl -sf "https://mammoli.ar/radio/api/cron_close_sessions.php?key=$RADIO_ADMIN_KEY"

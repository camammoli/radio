name: Enriquecer emisoras v2

on:
  schedule:
    - cron: '0 10 1,15 * *'   # días 1 y 15 de cada mes
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enriquecer con Radio Browser + ICY
        env:
          CRAWLER_TOKEN: ${{ secrets.CRAWLER_TOKEN }}
        run: |
          python3 crawlers/enrich_v2.py --icy --workers 15 --force

name: Deduplicar streamtheworld

on:
  schedule:
    - cron: '30 11 * * 1'   # Todos los lunes 11:30 UTC (08:30 AR), después de competitor-scan
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deduplicar emisoras streamtheworld
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          CRAWLER_TOKEN: ${{ secrets.CRAWLER_TOKEN }}
        run: |
          python3 crawlers/dedupe_streamtheworld_v2.py --apply --notify

name: Competitor Scan

on:
  schedule:
    - cron: '0 11 * * 1'   # Todos los lunes 11:00 UTC (08:00 AR)
  workflow_dispatch:         # Permite correrlo manualmente desde GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Download DB from FTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --ftp-ssl -k \
            -u "carlos@mammoli.ar:${FTP_PASS}" \
            "ftp://mammoli.ar/radio/db/radio_v2.sqlite" \
            -o db/radio_v2.sqlite
          echo "DB size: $(du -sh db/radio_v2.sqlite | cut -f1)"

      - name: Run competitor scan
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          RADIO_DB_PATH: db/radio_v2.sqlite
        run: python3 crawlers/competitor_scan.py

      # El Telegram trunca a 20 items por seccion — esto sube el listado
      # completo (reports/competitor_scan_full.json) como artifact, asi no
      # se pierde el resto como pasaba antes (ver TKT-0715).
      - name: Subir reporte completo como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-scan-full-${{ github.run_number }}
          path: reports/competitor_scan_full.json
          retention-days: 90
          if-no-files-found: ignore
